name: Build and publish SENSORITY

on:
  push:
    branches: [main]
    paths-ignore:
      - "index.html"
      - "assets/**"
      - "favicon.svg"
      - "og.jpg"
      - ".nojekyll"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sensority-static-publish
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # GitHub Pages is currently configured to publish the repository root.
      # Keep that root deployable while retaining Vite source files separately.
      - name: Sync production build to Pages root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets
          mkdir -p assets
          cp -R dist/assets/. assets/
          # Don't overwrite a newer source revision with an older build. A commit
          # that only updates the compiled root files is safe to sync against.
          git fetch origin main
          if ! git diff --quiet "$GITHUB_SHA" origin/main -- source.html src package.json package-lock.json vite.config.ts public; then
            echo "Source changed while this build was running; a newer run will publish it."
            exit 0
          fi
          git reset --hard origin/main

          cp dist/source.html ./index.html
          cp dist/favicon.svg dist/og.jpg .
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets favicon.svg og.jpg .nojekyll

          if git diff --cached --quiet; then
            echo "The checked-in Pages build is already up to date."
            exit 0
          fi

          git commit -m "chore: publish compiled SENSORITY site [skip ci]"
          git push
